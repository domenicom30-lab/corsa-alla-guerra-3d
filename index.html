<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#141916"/>
<title>Corsa alla Guerra 2D</title>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="topbar">
    <div class="hud-pill brand">CORSA ALLA GUERRA <em>2D</em></div>
    <div class="hud-pill level">LIV. 1 <span id="hearts">❤️❤️❤️</span></div>
    <div class="hud-pill points" id="points">PUNTI: 0</div>
    <div class="hud-pill finish" id="stats">TRAGUARDO: 200 m</div>
    <button id="pause" aria-label="Pausa">Ⅱ</button>
  </div>
  <div id="message">TOCCA PER INIZIARE</div>
  <div id="controls">
    <div class="control-group"><button id="left" aria-label="Sinistra">⬅<small>SINISTRA</small></button><button id="right" aria-label="Destra">➡<small>DESTRA</small></button></div>
    <div class="control-group"><button id="jump" aria-label="Salta">⬆<small>SALTA</small></button><button id="duck" aria-label="Abbassati">⬇<small>ABBASSATI</small></button></div>
  </div>
  <div id="rotate">RUOTA IL TELEFONO IN ORIZZONTALE</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
