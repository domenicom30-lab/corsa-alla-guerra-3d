<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#101619"/>
<title>Corsa alla Guerra 2D — Operazione Ferro</title>
</head>
<body>
<canvas id="game" aria-label="Corsa alla Guerra 2D"></canvas>
<div id="hud">
  <header class="topbar">
    <div class="hud-pill identity">
      <div class="portrait portrait-player" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="face" x2="0" y2="1"><stop stop-color="#d6b494"/><stop offset="1" stop-color="#79624c"/></linearGradient></defs><path fill="#292e27" d="M6 80Q8 52 27 47H52Q75 55 76 80Z"/><ellipse cx="40" cy="37" rx="19" ry="24" fill="url(#face)"/><path d="M17 23Q20 6 40 6Q60 6 65 25L48 20Q31 28 17 23" fill="#1a1d1a"/><path d="M14 23Q41 13 65 22L61 28Q35 23 16 29Z" fill="#252a23"/><path d="M31 39h6m9 0h6" stroke="#26211d" stroke-width="3"/><path d="M35 54q6 3 12-1" fill="none" stroke="#4e3831" stroke-width="2"/></svg></div>
      <span class="level-label">LIV. <b id="level">1</b></span>
    </div>
    <div class="hud-pill lives" id="hearts" aria-label="Tre vite">
      <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    </div>
    <div class="hud-pill points" id="points">PUNTI: 0</div>
    <div class="hud-pill finish">
      <div class="portrait portrait-target" aria-hidden="true"><svg viewBox="0 0 80 80"><path fill="#2c3130" d="M2 80Q8 52 28 47H52Q72 52 78 80Z"/><path fill="#b59b83" d="M22 23Q22 8 40 8Q58 8 58 23V43Q54 57 40 58Q26 57 22 43Z"/><path fill="#242522" d="M20 22Q23 3 40 4Q57 4 60 22Q44 16 20 22Z"/><path stroke="#302720" stroke-width="3" d="M30 35h7m8 0h7m-16 10q5-3 9 0"/><path fill="#202121" d="M34 44Q40 41 46 44L48 49Q40 47 32 49Z"/></svg></div>
      <span id="stats">TRAGUARDO: 200 m</span>
    </div>
    <button id="pause" class="pause-button" aria-label="Pausa"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="5" width="6" height="22" rx="2"/><rect x="19" y="5" width="6" height="22" rx="2"/></svg></button>
  </header>
  <div class="game-title">CORSA ALLA GUERRA <strong>2D · v2.7</strong></div>
   <div id="vehicle-armor" role="status" aria-label="Integrità del carro armato" hidden>
     <span id="vehicle-armor-label">CORAZZA 100%</span>
     <div class="armor-track" aria-hidden="true"><div id="vehicle-armor-fill"></div></div>
   </div>
  <div id="message">TOCCA PER INIZIARE</div>
  <div id="victory-credit" aria-live="polite">MISSIONE COMPIUTA · GRAZIE PER AVER GIOCATO</div>
  <div id="controls">
    <button id="vehicle-toggle" type="button" aria-label="Entra nel carro armato" hidden disabled>ENTRA NEL CARRO</button>
    <div class="control-group">
      <button id="left" aria-label="Sinistra"><svg viewBox="0 0 64 64"><path d="M26 9 4 32l22 23V41h34V23H26Z"/></svg><small>SINISTRA</small></button>
      <button id="right" aria-label="Destra"><svg viewBox="0 0 64 64"><path d="m38 9 22 23-22 23V41H4V23h34Z"/></svg><small>DESTRA</small></button>
      <button id="slide" class="slide-button" aria-label="Scivola sotto i proiettili"><svg viewBox="0 0 64 64"><path d="M7 44h15l9-17 10 6 11-5 6 7-14 8-11-7-5 12H7zM28 14a9 9 0 1 0 18 0 9 9 0 0 0-18 0" /></svg><small>SCIVOLA</small></button>
    </div>
    <div class="control-group">
      <button id="jump" aria-label="Salta"><svg viewBox="0 0 64 64"><path d="M32 4 7 30h16v30h18V30h16Z"/></svg><small>SALTA</small></button>
      <button id="shoot" aria-label="Spara" class="shoot-button"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 27h34v8H8zM40 23h14v16H40zM19 35h13l-5 18H16zM52 27h9v8h-9z"/></svg><small>SPARA</small></button>
      <button id="grenade" aria-label="Lancia granata" class="grenade-button"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="18" width="20" height="36" rx="9"/><path d="M26 18v-7h12v7M38 11q13-9 15 4" fill="none" stroke="currentColor" stroke-width="5"/></svg><small>GRANATA</small></button>
      <button id="duck" aria-label="Abbassati"><svg viewBox="0 0 64 64"><path d="M32 60 7 34h16V4h18v30h16Z"/></svg><small>ABBASSATI</small></button>
    </div>
  </div>
  <div id="rotate">RUOTA IL TELEFONO IN ORIZZONTALE</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
