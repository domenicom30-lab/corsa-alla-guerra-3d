<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101914" />
  <title>Corsa alla Guerra 3D</title>
</head>
<body>
  <div id="hud">
    <div class="brand">CORSA ALLA GUERRA <span>3D</span></div>
    <div id="stats">Distanza: 0 m</div>
    <div id="quality-panel"><label for="quality-select">GRAFICA</label><select id="quality-select" aria-label="Qualità grafica"><option value="balanced">Bilanciata</option><option value="high" selected>Alta</option><option value="ultra">Ultra</option></select></div>
    <div id="message">TOCCA PER INIZIARE</div>
    <div id="controls"><button id="left" aria-label="Sinistra"><span>◀</span><small>SINISTRA</small></button><button id="right" aria-label="Destra"><span>▶</span><small>DESTRA</small></button><button id="jump" aria-label="Salta"><span>↑</span><small>SALTA</small></button><button id="duck" aria-label="Abbassati"><span>↓</span><small>ABBASSATI</small></button></div>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
