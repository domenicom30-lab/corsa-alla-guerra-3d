name: Automated quality gates

on:
  pull_request:
    branches: [main, rebuild-arcade-final]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        run: node --check main.js
      - name: Gameplay and asset smoke tests
        run: npm run check
      - name: Production web build
        run: npm run build
      - name: Save diagnostic summary
        if: always()
        run: |
          echo "### Automated quality gates" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "These checks do not measure on-device FPS or screenshot fidelity." >> "$GITHUB_STEP_SUMMARY"
