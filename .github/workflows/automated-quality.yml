name: Automated quality gates

on:
  pull_request:
    branches: [main, rebuild-arcade-final]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install raster art renderer
        run: python3 -m pip install --quiet Pillow
      - name: Import original 2D image packs
        run: python3 scripts/import_2d_assets.py
      - name: Build all mandatory raster atlases
        run: python3 scripts/build_raster_art.py
      - name: Visual fidelity regression tests
        run: python3 scripts/test_visual_v21.py
      - name: Validate battle FX and other scene skies
        run: python3 scripts/test_art_v23.py
      - name: Validate original upward-aiming animation
        run: python3 scripts/test_aimup_art.py
      - name: Validate distinct stage props and crouch firing frames
        run: python3 scripts/test_art_v26.py
      - name: Validate four additional illustrated stage landmarks
        run: python3 scripts/test-secondary-landmarks.py
      - name: Validate individual detailed background environments
        run: python3 scripts/test-environment-details.py
      - name: Regress actual fortress screenshot and eliminate pale sky discs
        run: python3 scripts/test-fortress-clarity.py
      - name: Validate original animated drivable tank art
        run: python3 scripts/test_tank_art.py
      - name: Validate repainted armored vehicle detail and optics
        run: python3 scripts/test-tank-redesign.py
      - name: Test new hero action sprites
        run: python3 scripts/test_art_v28.py
      - name: Validate breathing, jump anticipation and original cloth motion
        run: python3 scripts/test-hero-secondary-motion.py
      - name: Validate premium original actor and armor materials
        run: python3 scripts/test-surface-materials.py
      - name: Validate articulated infantry and distinct enemy silhouettes
        run: python3 scripts/test-actor-redraw.py
      - name: Generate real 2D sprite art review
        run: python3 scripts/build-actor-review.py
      - name: Upload sprite contact sheet for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: CorsaGuerra-Original-Actor-Review
          path: artifacts/actor-review.png
          if-no-files-found: error
          retention-days: 14
      - name: Verify distinct airborne attack and movement art
        run: python3 scripts/test-airborne-art.py
      - name: Validate new slide and melee animation sheets
        run: python3 scripts/test_action_poses.py
      - name: Validate illustrated prisoner and destructible barricade atlases
        run: python3 scripts/test_gameplay_props_v29.py
      - name: Validate crouched and hit-reacting enemy sprites
        run: python3 scripts/test_enemy_actions_v30.py
      - name: Validate four original enemy recoil and grenade-release atlases
        run: python3 scripts/test_enemy_fire_v31.py
      - name: Validate original illustrated enemy knockdowns
        run: python3 scripts/test-enemy-falling-art.py
      - name: Validate distinct boss damage artwork across three phases
        run: python3 scripts/test-boss-phase-art.py
      - name: Validate six original grenade-throw animation keys
        run: python3 scripts/test-grenade-throw-art.py
      - name: JavaScript syntax check
        run: node --check main.js
      - name: Gameplay and asset smoke tests
        run: npm run check
      - name: Test Android immersive fullscreen configuration
        run: python3 scripts/android_immersive.py --self-test
      - name: Functional 2D gameplay mechanics tests
        run: node scripts/test-arcade-mechanics.mjs
      - name: Production web build
        run: npm run build
      - name: Save diagnostic summary
        if: always()
        run: |
          echo "### Automated quality gates" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "These checks do not measure on-device FPS or screenshot fidelity." >> "$GITHUB_STEP_SUMMARY"

  # This is a one-time opt-in preview build: only a main commit explicitly
  # tagged [android-preview] launches it, and never before quality passes.
  preview_apk:
    name: Verified Android 2.8 preview APK
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[android-preview]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare raster renderer
        run: python3 -m pip install --quiet Pillow
      - name: Extract original 2D art packs
        run: python3 scripts/import_2d_assets.py
      - name: Build all original sprite atlases
        run: python3 scripts/build_raster_art.py
      - name: Verify game and sprite data before packaging
        run: npm run check && python3 scripts/test-enemy-falling-art.py && python3 scripts/test-boss-phase-art.py && python3 scripts/test-secondary-landmarks.py && python3 scripts/test-environment-details.py
      - name: Compile release-candidate web bundle
        run: npm run build
      - name: Create Android native project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Enable fullscreen immersive Android landscape
        run: python3 scripts/android_immersive.py
      - name: Install branded Android icon
        run: python3 scripts/brand_android.py
      - name: Set isolated Android preview version
        run: |
          sed -i 's/versionCode 1/versionCode 28/; s/versionName "1.0"/versionName "2.8.0"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Build debug-signed installable APK with retry
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt / 3"
            if ./gradlew assembleDebug --no-daemon; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Inspect raster assets packaged into APK
        run: python3 scripts/verify_apk_assets.py
      - name: Verify APK signature, package name and version
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="$ANDROID_HOME"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/cag28-badging.txt
          grep -q "name='com.corsaguerra.arcadepreview28'" /tmp/cag28-badging.txt
          grep -q "versionName='2.8.0'" /tmp/cag28-badging.txt
          sha256sum "$APK" | tee android-preview-sha256.txt
          echo "PASS: Android 2.8 installable APK, original sprites and signature."
      - name: Upload tested Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Corsa-alla-Guerra-2D-Preview-2.8-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-preview-sha256.txt
          if-no-files-found: error
          retention-days: 30
