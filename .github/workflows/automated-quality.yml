name: Automated quality gates

on:
  pull_request:
    branches: [main, rebuild-arcade-final]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install raster art renderer
        run: python3 -m pip install --quiet Pillow
      - name: Import original 2D image packs
        run: python3 scripts/import_2d_assets.py
      - name: Build all mandatory raster atlases
        run: python3 scripts/build_raster_art.py
      - name: Visual fidelity regression tests
        run: python3 scripts/test_visual_v21.py
      - name: Validate battle FX and other scene skies
        run: python3 scripts/test_art_v23.py
      - name: Validate original upward-aiming animation
        run: python3 scripts/test_aimup_art.py
      - name: Validate distinct stage props and crouch firing frames
        run: python3 scripts/test_art_v26.py
      - name: Validate original animated drivable tank art
        run: python3 scripts/test_tank_art.py
      - name: JavaScript syntax check
        run: node --check main.js
      - name: Gameplay and asset smoke tests
        run: npm run check
      - name: Functional 2D gameplay mechanics tests
        run: node scripts/test-arcade-mechanics.mjs
      - name: Production web build
        run: npm run build
      - name: Save diagnostic summary
        if: always()
        run: |
          echo "### Automated quality gates" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "These checks do not measure on-device FPS or screenshot fidelity." >> "$GITHUB_STEP_SUMMARY"
