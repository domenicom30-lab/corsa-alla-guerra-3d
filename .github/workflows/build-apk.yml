
name: Build Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild-arcade-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Import 2D artwork from ZIP packages
        run: python3 scripts/import_2d_assets.py

      - name: Fetch CC0 animated soldier sprite sheet
        shell: bash
        run: |
          mkdir -p public/assets/arcade
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 90 \
            'https://opengameart.org/sites/default/files/all_sprites.png' \
            -o public/assets/arcade/space-soldier-cc0.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('public/assets/arcade/space-soldier-cc0.png')
          data=p.read_bytes()
          assert data[:8]==b'\\x89PNG\\r\\n\\x1a\\n', 'Asset is not a PNG'
          w,h=struct.unpack('>II',data[16:24]);assert w>=256 and h>=192,(w,h)
          print('CC0 soldier integrated:',w,h,len(data),'bytes')
          PY

      - name: Validate pure 2D gameplay
        run: npm run check

      - name: Build web game
        run: npm run build

      - name: Check Capacitor
        run: npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with retry
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Tentativo Gradle $attempt di 3"

            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build fallita. Attendo prima di riprovare..."
              sleep 20
            fi
          done

          echo "Build fallita dopo 3 tentativi."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corsa-alla-Guerra-2D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
