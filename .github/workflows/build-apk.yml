
name: Build Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild-arcade-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install raster art renderer
        run: python3 -m pip install --quiet Pillow

      - name: Import 2D artwork from ZIP packages
        run: python3 scripts/import_2d_assets.py

      - name: Render mandatory PNG sprite sheets and backgrounds
        run: python3 scripts/build_raster_art.py

      - name: Visual fidelity regression tests
        run: python3 scripts/test_visual_v21.py
      - name: Validate battle FX and other scene skies
        run: python3 scripts/test_art_v23.py
      - name: Validate original upward-aiming animation
        run: python3 scripts/test_aimup_art.py
      - name: Validate distinct stage props and crouch firing frames
        run: python3 scripts/test_art_v26.py

      - name: Validate pure 2D gameplay
        run: npm run check

      - name: Build web game
        run: npm run build

      - name: Check Capacitor
        run: npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Install final branded Android icon
        run: python3 scripts/brand_android.py

      - name: Set Android 2.5 preview version
        run: |
          sed -i 's/versionCode 1/versionCode 25/; s/versionName "1.0"/versionName "2.5.0"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with retry
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Tentativo Gradle $attempt di 3"

            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build fallita. Attendo prima di riprovare..."
              sleep 20
            fi
          done

          echo "Build fallita dopo 3 tentativi."
          exit 1

      - name: Verify every raster sprite actually shipped inside Android APK
        run: python3 scripts/verify_apk_assets.py

      - name: Verify Android APK package and cryptographic signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/cag-apk-badging.txt
          grep -q "name='com.corsaguerra.arcadeprova25'" /tmp/cag-apk-badging.txt
          grep -q "versionName='2.5.0'" /tmp/cag-apk-badging.txt
          echo "PASS: signed 2.5.0 installation package."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corsa-alla-Guerra-2D-v2.5-Scala-Carro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
