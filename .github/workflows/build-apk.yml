
name: Build Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild-arcade-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Import 2D artwork from ZIP packages
        run: python3 scripts/import_2d_assets.py

      - name: Fetch optional CC0 soldier sprite sheet (non-blocking)
        shell: bash
        run: |
          mkdir -p public/assets/arcade
          tmp="$(mktemp)"
          if curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 45 \\
            'https://opengameart.org/sites/default/files/all_sprites.png' -o "$tmp"; then
            if python3 - "$tmp" <<'PY'
          import sys,struct
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes()
          if data[:8]!=bytes.fromhex('89504e470d0a1a0a'):
              print('Remote asset is not a PNG; keeping bundled procedural soldier.')
              sys.exit(1)
          w,h=struct.unpack('>II',data[16:24])
          if w<256 or h<192:
              print('Remote sprite dimensions unsupported:',w,h)
              sys.exit(1)
          print('Validated optional CC0 soldier:',w,h)
          PY
            then
              cp "$tmp" public/assets/arcade/space-soldier-cc0.png
            else
              echo "::warning::External sprite unavailable or invalid; using procedural soldier."
            fi
          else
            echo "::warning::External sprite download failed; using procedural soldier."
          fi
          rm -f "$tmp"

      - name: Validate pure 2D gameplay
        run: npm run check

      - name: Build web game
        run: npm run build

      - name: Check Capacitor
        run: npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with retry
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Tentativo Gradle $attempt di 3"

            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build fallita. Attendo prima di riprovare..."
              sleep 20
            fi
          done

          echo "Build fallita dopo 3 tentativi."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corsa-alla-Guerra-2D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
